<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Unity WebGL diag</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: monospace; }
    #unity-canvas { background: #231F20; display: block; }
    #out { white-space: pre-wrap; font-size: 11px; padding: 8px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
  <div id="out"></div>
  <script>
    // ---- log capture (installed before anything else) ----
    var FLAGS = new URLSearchParams(location.search);
    var LOG = [];
    var t0 = Date.now();
    function rec(tag, s) {
      var line = '[' + ((Date.now() - t0) / 1000).toFixed(2) + 's ' + tag + '] ' + s;
      LOG.push(line);
      if (LOG.length > 4000) LOG.shift();
    }
    ['log', 'warn', 'error', 'info', 'debug'].forEach(function (k) {
      var orig = console[k];
      console[k] = function () {
        var s = Array.prototype.map.call(arguments, function (a) {
          if (typeof a === 'string') return a;
          if (a instanceof Error) return (a.message || '') + '\n' + (a.stack || '');
          try { return JSON.stringify(a); } catch (e) { return String(a); }
        }).join(' ');
        rec(k, s);
        return orig.apply(console, arguments);
      };
    });
    window.addEventListener('error', function (e) {
      rec('onerror', (e.message || '') + ' @' + e.filename + ':' + e.lineno + ':' + e.colno +
        (e.error && e.error.stack ? '\n' + e.error.stack : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      rec('unhandled', (r && (r.message || r)) + (r && r.stack ? '\n' + r.stack : ''));
    });
    function flush(reason) {
      rec('flush', reason);
      var body = 'FLAGS=' + location.search + '\n' + LOG.join('\n');
      document.getElementById('out').textContent = body;
      try {
        fetch('/__log', { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain' } });
      } catch (e) { }
    }
    window.__flush = flush;
    setTimeout(function () { flush('timeout-90s'); }, 90000);

    // ---- optional extras from index.html, toggled by query flags ----
    function inject(src, cb) {
      var s = document.createElement('script');
      s.src = src; s.onload = cb; s.onerror = function () { rec('err', 'failed to load ' + src); cb && cb(); };
      document.head.appendChild(s);
    }

    var buildUrl = 'Build';
    var config = {
      dataUrl: buildUrl + '/frontend.data',
      frameworkUrl: buildUrl + '/frontend.framework.js',
      codeUrl: buildUrl + '/frontend.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'MIT Beaver Works',
      productName: 'RacecarSim',
      productVersion: '2.8.3',
      showBanner: function (msg, type) { rec('banner:' + type, msg); }
    };

    function start() {
      var canvas = document.querySelector('#unity-canvas');
      if (FLAGS.get('fill')) {
        canvas.removeAttribute('width'); canvas.removeAttribute('height');
        canvas.style.width = '100%'; canvas.style.height = '100vh';
      }
      rec('info', 'calling createUnityInstance; typeof createUnityInstance=' + typeof createUnityInstance +
        '; SAB=' + (typeof SharedArrayBuffer) + '; isolated=' + window.crossOriginIsolated);
      var lastPct = -1;
      createUnityInstance(canvas, config, function (p) {
        var pct = Math.round(p * 100);
        if (pct !== lastPct && pct % 10 === 0) { lastPct = pct; rec('progress', pct + '%'); }
      }).then(function (inst) {
        window.unityInstance = inst;
        rec('info', 'UNITY INSTANCE READY');
        setTimeout(function () { flush('ready+8s'); }, 8000);
      }).catch(function (err) {
        rec('createUnityInstance-reject', (err && err.message || err) + '\n' + (err && err.stack || ''));
        flush('rejected');
      });
    }

    function afterExtras() {
      var loader = document.createElement('script');
      loader.src = buildUrl + '/frontend.loader.js';
      loader.onload = start;
      loader.onerror = function () { rec('err', 'loader.js failed'); flush('loader-fail'); };
      document.body.appendChild(loader);
    }

    var pending = [];
    if (FLAGS.get('coi')) pending.push('coi-serviceworker.js');
    if (FLAGS.get('pyodide')) pending.push('https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js');
    (function next() {
      if (!pending.length) return afterExtras();
      inject(pending.shift(), next);
    })();
  </script>
</body>
</html>

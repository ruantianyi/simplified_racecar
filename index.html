<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIT Racecar Neo - Simulator Only</title>

    <!-- NOTE: coi-serviceworker.js is deliberately NOT loaded. This build uses no threads and
         never touches SharedArrayBuffer (verified: 0 pthread/SAB references in frontend.framework.js;
         the only SAB mention in the loader is browser-capability telemetry), so cross-origin
         isolation buys nothing here. What it did cost: a forced page reload plus a service worker
         proxying every Build/* fetch, which can hand Unity a stale frontend.data/.wasm.
         See unregisterStaleServiceWorkers() below, which cleans up any already-registered copy. -->
    <!-- Load Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }
        #unity-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #231F20;
            display: block;
        }
        .status-badge {
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <!-- Loading Screen -->
        <div id="unity-loading-bar" style="position: absolute; inset: 0; background: rgba(15, 17, 23, 0.92); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 2rem;">
            <div style="font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px;">
                <span class="loading-spinner" style="display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#3b82f6; border-radius:50%; animation: spin 1s linear infinite;"></span>
                <span>Loading Simulator</span>
            </div>
            <div style="width: 80%; max-width: 380px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.15);">
                <div id="unity-progress-bar-full" style="width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); border-radius: 6px; transition: width 0.2s ease;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; width: 80%; max-width: 380px; margin-top: 10px; font-size: 0.85rem; color: rgba(255,255,255,0.7);">
                <span id="unity-loading-text">Downloading WebGL engine &amp; assets...</span>
                <span id="unity-loading-percent" style="font-weight: 600; color: #60a5fa;">0%</span>
            </div>
        </div>

        <!-- Status Badge -->
        <div class="sim-overlay-badges" style="position: absolute; top: 10px; right: 10px; z-index: 10;">
            <span id="unity-status" class="status-badge">Loading...</span>
        </div>

        <!-- Python error panel -->
        <pre id="py-error" style="display:none; position:absolute; left:10px; bottom:10px; max-width:70%; max-height:40%; overflow:auto; z-index:15; margin:0; padding:10px; background:rgba(120,0,0,0.85); color:#fff; font-size:12px; white-space:pre-wrap; border-radius:6px;"></pre>

        <!-- Unity WebGL Canvas -->
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script>
        window.unityInstance = null;
        var buildUrl = "Build";
        var config = {
            dataUrl: buildUrl + "/frontend.data",
            frameworkUrl: buildUrl + "/frontend.framework.js",
            codeUrl: buildUrl + "/frontend.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "MIT Beaver Works",
            productName: "RacecarSim",
            productVersion: "2.8.3",
            // Unity otherwise stashes frontend.data (76 MB) and frontend.wasm in an IndexedDB
            // "UnityCache" keyed by companyName/productName/productVersion. Those never change
            // between rebuilds, so a rebuilt player silently reuses the previous build's cached
            // data alongside the new .wasm. The mismatch does not fail cleanly -- IL2CPP runs
            // against the wrong metadata and dies as "RangeError: Maximum call stack size
            // exceeded" inside invoke_iii. Always fetch from the network; the browser's normal
            // HTTP cache (ETag/Last-Modified) still avoids re-downloading unchanged files.
            cacheControl: function () { return "no-store"; },
            showBanner: function (msg, type) {
                if (type === "error") console.error("[Unity Banner]", msg);
                else if (type === "warning") console.warn("[Unity Banner]", msg);
                else console.log("[Unity Banner]", msg);
            }
        };

        // GameObject that Unity's PythonInterface listens on. Must match the receiver
        // MonoBehaviour in the Unity project (Assets/Scripts/NonMonoBehavior/BrowserMessageReceiver.cs).
        const UNITY_RECEIVER = 'BrowserMessageReceiver';

        function showPythonError(message) {
            const el = document.getElementById('py-error');
            if (!el) return;
            el.style.display = 'block';
            el.textContent = message;
        }

        // Unity routes Debug.Log straight to console.log and swallows SendMessage to a
        // missing GameObject. That is exactly how a broken JS -> Unity bridge presents
        // itself: the program runs, the car never moves. Surface it instead.
        (function () {
            const origLog = console.log;
            console.log = function (msg) {
                if (typeof msg === 'string' && msg.indexOf('SendMessage: object ' + UNITY_RECEIVER) === 0) {
                    showPythonError(
                        "Unity WebGL build has no browser->Unity receiver.\n\n" + msg.trim() + "\n\n" +
                        "Drive and connect packets from Python are being discarded, so the car cannot move.\n" +
                        "Fix: add a MonoBehaviour named '" + UNITY_RECEIVER + "' with public\n" +
                        "ReceiveFromJS(string base64) / ReceiveFromJSAsync(string base64) methods that forward\n" +
                        "to PythonInterface, put it on a DontDestroyOnLoad GameObject of the same name,\n" +
                        "and rebuild the WebGL player."
                    );
                }
                return origLog.apply(console, arguments);
            };
        })();

        // --- Python/Unity Bridge Functions ---
        // Header enum (matches Assets/Scripts/NonMonoBehavior/PythonInterface.cs):
        //   0 error, 1 connect, 2 unity_start, 3 unity_update, 4 unity_exit,
        //   5 python_finished, 6 python_send_next, 7 python_exit,
        //   22 drive_set_speed_angle, 23 drive_stop, 24 drive_set_max_speed
        let activeRacecar = null;

        function sendToUnity(buffer, method) {
            if (!window.unityInstance) return;
            const base64 = btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
            window.unityInstance.SendMessage(UNITY_RECEIVER, method || 'ReceiveFromJS', base64);
        }

        function packet(len, fill) {
            const buffer = new ArrayBuffer(len);
            fill(new DataView(buffer));
            return buffer;
        }

        function sendConnectToUnity() {
            sendToUnity(packet(1, v => v.setUint8(0, 1)));
        }

        function sendFinishedToUnity(isAsync) {
            sendToUnity(packet(1, v => v.setUint8(0, 5)), isAsync ? 'ReceiveFromJSAsync' : 'ReceiveFromJS');
        }

        function sendErrorToUnity() {
            sendToUnity(packet(2, v => { v.setUint8(0, 0); v.setUint8(1, 2); })); // error / python_exception
        }

        function sendPythonExitToUnity() {
            sendToUnity(packet(1, v => v.setUint8(0, 7)));
        }

        window.unityRegisterRacecar = function (racecar) {
            activeRacecar = racecar;
            try { window._rc_startFunc = racecar._start_func || null; } catch (e) { window._rc_startFunc = null; }
            try { window._rc_updateFunc = racecar._update_func || null; } catch (e) { window._rc_updateFunc = null; }
            try { window._rc_updateSlowFunc = racecar._update_slow_func || null; } catch (e) { window._rc_updateSlowFunc = null; }
            try { window._rc_updateSlowTime = racecar._update_slow_time || 1.0; } catch (e) { window._rc_updateSlowTime = 1.0; }

            window.isPythonRunning = true;
            // Unity will not offer User Program mode until it receives a connect packet,
            // but its receiver GameObject only exists once a level scene is loaded — a
            // connect sent now, at the main menu, is dropped. Keep announcing ourselves
            // (idempotent on the Unity side) until Unity starts driving the loop.
            sendConnectToUnity();
            connectHeartbeat = setInterval(sendConnectToUnity, 1000);
            console.log("Racecar registered successfully.");
        };

        window.stopProgram = function () {
            if (connectHeartbeat !== null) {
                clearInterval(connectHeartbeat);
                connectHeartbeat = null;
            }
            for (const key of ['_rc_startFunc', '_rc_updateFunc', '_rc_updateSlowFunc']) {
                const fn = window[key];
                if (fn && typeof fn.destroy === 'function') { try { fn.destroy(); } catch (e) {} }
                window[key] = null;
            }
            if (activeRacecar && typeof activeRacecar.destroy === 'function') {
                try { activeRacecar.destroy(); } catch (e) {}
            }
            activeRacecar = null;
            window.isPythonRunning = false;
            sendPythonExitToUnity();
        };

        // Hook C# callbacks triggered by Unity's Update loop
        let slowTimer = 0;
        let connectHeartbeat = null;
        window.unityToPython = function (bytes) {
            if (!activeRacecar) return;
            const header = bytes[0];

            // Unity is driving us now, so it has our connect
            if (connectHeartbeat !== null) {
                clearInterval(connectHeartbeat);
                connectHeartbeat = null;
            }

            try {
                if (header === 2) { // unity_start
                    slowTimer = 0;
                    window._kbControllerTick();
                    if (window._rc_startFunc) window._rc_startFunc();
                    sendFinishedToUnity(false);
                } else if (header === 3) { // unity_update
                    window._kbControllerTick();
                    if (window._rc_updateFunc) window._rc_updateFunc();
                    slowTimer += 1 / 60;
                    if (window._rc_updateSlowFunc && slowTimer >= (window._rc_updateSlowTime || 1.0)) {
                        slowTimer = 0;
                        window._rc_updateSlowFunc();
                    }
                    sendFinishedToUnity(false);
                } else if (header === 4) { // unity_exit
                    window.stopProgram();
                }
            } catch (err) {
                console.error("[Python Loop Error]", err);
                showPythonError("[Python Loop Error]\n" + (err.message || err));
                sendErrorToUnity();
            }
        };

        window.unityToPythonAsync = function (bytes) {
            console.log("Async packet from Unity: ", bytes);
        };

        // --- Hardware State ---
        window.racecarState = window.racecarState || {};
        window.racecarState.accel = { to_py: () => [0, 0, 0] };
        window.racecarState.gyro = { to_py: () => [0, 0, 0] };

        window.unityPushState = function (ax, ay, az, gx, gy, gz) {
            window.racecarState.accel = { to_py: () => [ax, ay, az] };
            window.racecarState.gyro = { to_py: () => [gx, gy, gz] };
        };

        window.unityPushLidar = function (samplesFloat32) {
            window.racecarState.lidar = { to_py: () => samplesFloat32 };
        };

        window.unityPushCamera = function (pixelsUint8, w, h) {
            window.racecarState.camera = { to_py: () => pixelsUint8, w: w, h: h };
        };

        // --- Keyboard-to-Controller Mapping ---
        //   Buttons: Z=A(0), X=B(1), C=X(2), V=Y(3), U=LB(4), O=RB(5), Enter=START(8), Backspace=BACK(9)
        //   Left joystick: WASD or arrow keys.  Right joystick: IJKL.  Triggers: Q=left, E=right.
        (function () {
            const KEY_BUTTON_MAP = {
                'KeyZ': 0, 'KeyX': 1, 'KeyC': 2, 'KeyV': 3,
                'KeyU': 4, 'KeyO': 5, 'Enter': 8, 'Backspace': 9,
            };

            const heldKeys = new Set();
            let pendingPressed = 0;
            let pendingReleased = 0;

            function buildControllerState() {
                const uc = window.racecarState._unityController;

                let downMask = 0;
                for (const [code, bit] of Object.entries(KEY_BUTTON_MAP)) {
                    if (heldKeys.has(code)) downMask |= (1 << bit);
                }
                if (uc) downMask |= uc.down;

                const pressedMask = pendingPressed | (uc ? uc.pressed : 0);
                const releasedMask = pendingReleased | (uc ? uc.released : 0);
                // pressed/released are edge events: they last exactly one frame
                pendingPressed = 0;
                pendingReleased = 0;

                const tl = heldKeys.has('KeyQ') ? 1.0 : (uc ? uc.tl : 0.0);
                const tr = heldKeys.has('KeyE') ? 1.0 : (uc ? uc.tr : 0.0);

                let jlx = 0, jly = 0;
                if (heldKeys.has('KeyA') || heldKeys.has('ArrowLeft'))  jlx = -1.0;
                if (heldKeys.has('KeyD') || heldKeys.has('ArrowRight')) jlx =  1.0;
                if (heldKeys.has('KeyW') || heldKeys.has('ArrowUp'))    jly =  1.0;
                if (heldKeys.has('KeyS') || heldKeys.has('ArrowDown'))  jly = -1.0;

                let jrx = 0, jry = 0;
                if (heldKeys.has('KeyJ')) jrx = -1.0;
                if (heldKeys.has('KeyL')) jrx =  1.0;
                if (heldKeys.has('KeyI')) jry =  1.0;
                if (heldKeys.has('KeyK')) jry = -1.0;

                if (uc) {
                    jlx = jlx || uc.jlx; jly = jly || uc.jly;
                    jrx = jrx || uc.jrx; jry = jry || uc.jry;
                }

                window.racecarState.controller = {
                    down: downMask, pressed: pressedMask, released: releasedMask,
                    tl, tr, jlx, jly, jrx, jry
                };
            }

            window.unityPushController = function (down, pressed, released, tl, tr, jlx, jly, jrx, jry) {
                window.racecarState._unityController = { down, pressed, released, tl, tr, jlx, jly, jrx, jry };
                buildControllerState();
            };

            function isTypingTarget(e) {
                const t = e.target;
                return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
            }

            document.addEventListener('keydown', (e) => {
                if (isTypingTarget(e)) return;
                if (heldKeys.has(e.code)) return;
                heldKeys.add(e.code);
                const bit = KEY_BUTTON_MAP[e.code];
                if (bit !== undefined) pendingPressed |= (1 << bit);
                buildControllerState();
            }, false);

            document.addEventListener('keyup', (e) => {
                if (isTypingTarget(e)) return;
                heldKeys.delete(e.code);
                const bit = KEY_BUTTON_MAP[e.code];
                if (bit !== undefined) pendingReleased |= (1 << bit);
                buildControllerState();
            }, false);

            document.addEventListener('click', () => {
                const canvas = document.getElementById('unity-canvas');
                if (canvas && typeof canvas.focus === 'function') canvas.focus();
            });

            window._kbControllerTick = buildControllerState;
            buildControllerState();
        })();

        // --- Drive Bridge ---
        window.unitySetDrive = function (speed, angle) {
            sendToUnity(packet(12, v => {
                v.setUint8(0, 22);
                v.setFloat32(4, speed, true);
                v.setFloat32(8, angle, true);
            }));
        };

        window.unityStopDrive = function () {
            sendToUnity(packet(1, v => v.setUint8(0, 23)));
        };

        window.unitySetMaxSpeed = function (speed) {
            sendToUnity(packet(8, v => {
                v.setUint8(0, 24);
                v.setFloat32(4, speed, true);
            }));
        };

        const USER_PROGRAM = "functions_document.py";

        async function runUserProgram(unityStatus) {
            try {
                unityStatus.textContent = "Starting Python...";
                const pyodide = await loadPyodide();

                unityStatus.textContent = "Loading packages (numpy, cv2)...";
                await pyodide.loadPackage(['numpy', 'opencv-python']);

                unityStatus.textContent = "Fetching Python scripts...";
                const [coreCode, utilsCode, rawUserCode] = await Promise.all(
                    ['racecar_core.py', 'racecar_utils.py', USER_PROGRAM].map(f =>
                        fetch(f).then(r => {
                            if (!r.ok) throw new Error(`Could not fetch ${f} (HTTP ${r.status})`);
                            return r.text();
                        })
                    )
                );

                // The lab template points sys.path at a local ../library folder that does
                // not exist in the browser; racecar_core lives at /home/pyodide instead.
                const userCode = rawUserCode.replace(
                    /sys\.path\.insert\s*\(\s*\d+\s*,\s*['"][^'"]*library[^'"]*['"]\s*\)/g,
                    'pass  # sys.path.insert neutralized for Pyodide'
                );

                pyodide.FS.writeFile('/home/pyodide/racecar_core.py', coreCode);
                pyodide.FS.writeFile('/home/pyodide/racecar_utils.py', utilsCode);
                pyodide.FS.writeFile('/home/pyodide/' + USER_PROGRAM, userCode);

                unityStatus.textContent = "Executing Python script...";
                const safePath = JSON.stringify('/home/pyodide/' + USER_PROGRAM);
                await pyodide.runPythonAsync(`
import sys
if '/home/pyodide' not in sys.path:
    sys.path.insert(0, '/home/pyodide')

# exec into globals() so __name__ == '__main__' and the registration guard fires
with open(${safePath}, "r") as _f:
    exec(compile(_f.read(), ${safePath}, 'exec'), globals())
                `);

                if (!window.isPythonRunning) {
                    throw new Error(
                        USER_PROGRAM + " finished without calling rc.set_start_update(). " +
                        "The simulator has nothing to run."
                    );
                }

                unityStatus.textContent = "Python Running";
                unityStatus.style.background = "rgba(0, 0, 255, 0.5)";
            } catch (err) {
                console.error("Python Execution Error: ", err);
                showPythonError("[Python Execution Error]\n" + (err.message || err));
                unityStatus.textContent = "Python Error";
                unityStatus.style.background = "rgba(255, 0, 0, 0.5)";
            }
        }

        // A previously-registered coi-serviceworker still controls this page and keeps serving
        // Build/* from its own cache, so unregistering is not enough on its own -- the page has to
        // reload once to escape the controller. Guarded by sessionStorage so it can only happen once.
        const RELOAD_FLAG = "sw-cleanup-reloaded";
        async function unregisterStaleServiceWorkers() {
            if (!navigator.serviceWorker) return false;
            let regs = [];
            try { regs = await navigator.serviceWorker.getRegistrations(); } catch (e) { return false; }
            if (!regs.length) return false;
            await Promise.all(regs.map(r => r.unregister().catch(() => {})));
            if (navigator.serviceWorker.controller && !sessionStorage.getItem(RELOAD_FLAG)) {
                sessionStorage.setItem(RELOAD_FLAG, "1");
                location.reload();
                return true; // page is going away; do not start Unity
            }
            return false;
        }

        // Drop any UnityCache left over from before cacheControl:"no-store" was set.
        async function deleteStaleUnityCache() {
            if (!window.indexedDB) return;
            await new Promise((resolve) => {
                let req;
                try { req = indexedDB.deleteDatabase("UnityCache"); } catch (e) { return resolve(); }
                req.onsuccess = req.onerror = req.onblocked = () => resolve();
                setTimeout(resolve, 3000); // never let a blocked delete stall the loader
            });
        }

        const loadUnity = () => {
            const unityStatus = document.querySelector("#unity-status");
            const loadingBar = document.querySelector("#unity-loading-bar");
            const progressBarFull = document.querySelector("#unity-progress-bar-full");
            const loadingText = document.querySelector("#unity-loading-text");
            const loadingPercent = document.querySelector("#unity-loading-percent");
            const canvas = document.querySelector("#unity-canvas");

            if (window.location.protocol === "file:") {
                if (loadingBar) loadingBar.style.display = "none";
                unityStatus.textContent = "Needs Server";
                const msg = document.createElement("div");
                msg.style.cssText = "position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);color:#fff;font-family:inherit;padding:1rem;text-align:center;border-radius:8px;z-index:10;";
                msg.innerHTML = "<span style='font-size:2rem'>⚠️</span><br><strong>Simulator unavailable over file://</strong><br><br>The Unity loader fetches <code>Build/frontend.data</code> and <code>frontend.wasm</code> over HTTP, and browsers block those requests from <code>file://</code> origins.<br><br>Run <code>python server.py</code> in this folder and open <a href='http://localhost:8000' style='color:#7eb8f7'>localhost:8000</a> instead.";
                canvas.parentElement.style.position = "relative";
                canvas.parentElement.appendChild(msg);
                return;
            }

            const startUnity = () => {
                var savedDefine = window.define;
                var savedDefineAmd = savedDefine && savedDefine.amd;
                try {
                    delete window.define;
                } catch (e) {
                    try { window.define = undefined; } catch (e2) { }
                }

                createUnityInstance(canvas, config, (progress) => {
                    const pct = Math.round(progress * 100);
                    if (progressBarFull) progressBarFull.style.width = pct + "%";
                    if (loadingPercent) loadingPercent.textContent = pct + "%";
                    if (loadingText) {
                        if (pct < 90) loadingText.textContent = "Downloading WebGL engine & assets...";
                        else if (pct < 100) loadingText.textContent = "Initializing WebAssembly engine...";
                        else loadingText.textContent = "Launching Simulator...";
                    }
                }).then((instance) => {
                    if (savedDefine) {
                        window.define = savedDefine;
                        if (savedDefineAmd) window.define.amd = savedDefineAmd;
                    }
                    window.unityInstance = instance;
                    if (loadingBar) loadingBar.style.display = "none";
                    unityStatus.textContent = "Simulator Ready";
                    unityStatus.style.background = "rgba(0, 128, 0, 0.5)";

                    runUserProgram(unityStatus);

                }).catch((err) => {
                    console.error("Failed to load Unity Instance:", err);
                    const raw = String(err && err.message || err);
                    // A stack overflow in wasm means the engine ran but executed garbage: almost
                    // always mismatched build artifacts rather than a bug in the page.
                    const hint = /Maximum call stack size exceeded/i.test(raw)
                        ? "\n\nThis usually means mismatched Unity build artifacts (a cached " +
                          "frontend.data paired with a different frontend.wasm). Open DevTools -> " +
                          "Application -> Storage -> 'Clear site data', then reload."
                        : "";
                    if (loadingText) loadingText.textContent = "Failed to launch WebGL simulator: " + raw + hint;
                    if (loadingPercent) loadingPercent.textContent = "Error";
                    unityStatus.textContent = "Failed Load";
                    unityStatus.style.background = "rgba(255, 0, 0, 0.5)";
                });
            };

            var script = document.createElement("script");
            script.src = buildUrl + "/frontend.loader.js";
            script.onload = startUnity;
            document.body.appendChild(script);
        };

        // Auto load unity when page loads, after clearing caches that can feed it a stale build
        window.addEventListener('load', async () => {
            try {
                if (await unregisterStaleServiceWorkers()) return; // reloading
                await deleteStaleUnityCache();
            } catch (e) {
                console.warn("Cache cleanup failed, loading anyway:", e);
            }
            loadUnity();
        });
    </script>
</body>
</html>

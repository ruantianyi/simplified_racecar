<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIT Racecar Neo - Simulator Only</title>
    
    <!-- Cross-Origin Isolation for Unity WebGL SharedArrayBuffer support on GitHub Pages -->
    <script src="coi-serviceworker.js"></script>
    <!-- Load Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: sans-serif;
        }
        #unity-container { 
            width: 100%; 
            height: 100%; 
            position: relative; 
        }
        #unity-canvas { 
            width: 100%; 
            height: 100%; 
            background: #231F20; 
            display: block;
        }
        .status-badge {
            background: rgba(0,0,0,0.5); 
            color: white; 
            padding: 5px 10px; 
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <!-- Loading Screen -->
        <div id="unity-loading-bar" style="position: absolute; inset: 0; background: rgba(15, 17, 23, 0.92); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 2rem;">
            <div style="font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px;">
                <span class="loading-spinner" style="display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#3b82f6; border-radius:50%; animation: spin 1s linear infinite;"></span>
                <span>Loading Simulator</span>
            </div>
            <div style="width: 80%; max-width: 380px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.15);">
                <div id="unity-progress-bar-full" style="width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); border-radius: 6px; transition: width 0.2s ease;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; width: 80%; max-width: 380px; margin-top: 10px; font-size: 0.85rem; color: rgba(255,255,255,0.7);">
                <span id="unity-loading-text">Downloading WebGL engine & assets...</span>
                <span id="unity-loading-percent" style="font-weight: 600; color: #60a5fa;">0%</span>
            </div>
        </div>
        
        <!-- Status Badge -->
        <div class="sim-overlay-badges" style="position: absolute; top: 10px; right: 10px; z-index: 10;">
            <span id="unity-status" class="status-badge">Loading...</span>
        </div>
        
        <!-- Unity WebGL Canvas -->
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
        window.unityInstance = null;
        var buildUrl = "Build";
        var config = {
            dataUrl: buildUrl + "/frontend.data",
            frameworkUrl: buildUrl + "/frontend.framework.js",
            codeUrl: buildUrl + "/frontend.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "MIT Beaver Works",
            productName: "RacecarSim",
            productVersion: "2.8.3",
            showBanner: function (msg, type) {
                if (type === "error") console.error("[Unity Banner]", msg);
                else if (type === "warning") console.warn("[Unity Banner]", msg);
                else console.log("[Unity Banner]", msg);
            }
        };

        // --- Python/Unity Bridge Functions ---
        let activeRacecar = null;
        let isUnityConnected = false;

        function sendConnectToUnity() {
            if (window.unityInstance && isUnityConnected) {
                const buffer = new ArrayBuffer(1);
                new DataView(buffer).setUint8(0, 1); // 1 = Header.connect
                const base64 = btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
                try { window.unityInstance.SendMessage('BrowserMessageReceiver', 'ReceiveFromJS', base64); } catch(e){}
            }
        }

        function sendFinishedToUnity(isSlow) {
            if (window.unityInstance && isUnityConnected) {
                const buffer = new ArrayBuffer(1);
                new DataView(buffer).setUint8(0, isSlow ? 6 : 5); // 5 = update_finished, 6 = slow_update_finished
                const base64 = btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
                try { window.unityInstance.SendMessage('BrowserMessageReceiver', 'ReceiveFromJS', base64); } catch(e){}
            }
        }

        function sendErrorToUnity(errorMsg) {
            if (window.unityInstance && isUnityConnected) {
                try { window.unityInstance.SendMessage('BrowserMessageReceiver', 'ReceiveError', errorMsg); } catch(e){}
            }
        }

        window.unityRegisterRacecar = function (racecar) {
            activeRacecar = racecar;
            try { window._rc_startFunc = racecar._start_func || null; } catch (e) { window._rc_startFunc = null; }
            try { window._rc_updateFunc = racecar._update_func || null; } catch (e) { window._rc_updateFunc = null; }
            try { window._rc_updateSlowFunc = racecar._update_slow_func || null; } catch (e) { window._rc_updateSlowFunc = null; }
            
            window.isPythonRunning = true;
            if (isUnityConnected) {
                sendConnectToUnity();
            }
            console.log("Racecar registered successfully.");
        };

        window.unityToPython = function (bytes) {
            if (!activeRacecar) return;
            const header = bytes[0];

            if (!isUnityConnected) {
                isUnityConnected = true;
                sendConnectToUnity();
            }

            try {
                if (header === 2) { // unity_start
                    if (window._rc_startFunc) window._rc_startFunc();
                    sendFinishedToUnity(false);
                } else if (header === 3) { // unity_update
                    if (window._rc_updateFunc) window._rc_updateFunc();
                    sendFinishedToUnity(false);
                } else if (header === 4) { // unity_exit
                    isUnityConnected = false;
                }
            } catch (err) {
                console.error("[Python Loop Error]: " + err.message);
                sendErrorToUnity(err.message);
            }
        };

        window.unityToPythonAsync = function (bytes) {
            console.log("Async packet from Unity: ", bytes);
        };

        // --- Keyboard Controller Mapping ---
        const heldKeys = new Set();
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            heldKeys.add(e.code);
            updateControllerState();
        });
        document.addEventListener('keyup', (e) => {
            heldKeys.delete(e.code);
            updateControllerState();
        });

        function updateControllerState() {
            let downMask = 0;
            // 1=forward(A), 2=backward(B), 3=left(X), 4=right(Y)
            if (heldKeys.has('Digit1') || heldKeys.has('Numpad1')) downMask |= (1 << 0); // Button.A
            if (heldKeys.has('Digit2') || heldKeys.has('Numpad2')) downMask |= (1 << 1); // Button.B
            if (heldKeys.has('Digit3') || heldKeys.has('Numpad3')) downMask |= (1 << 2); // Button.X
            if (heldKeys.has('Digit4') || heldKeys.has('Numpad4')) downMask |= (1 << 3); // Button.Y
            
            window.racecarState = window.racecarState || {};
            const uc = window.racecarState._unityController || { down: 0, pressed: 0, released: 0, tl: 0, tr: 0, jlx: 0, jly: 0, jrx: 0, jry: 0 };
            
            window.racecarState.controller = { 
                down: downMask | uc.down, 
                pressed: uc.pressed, 
                released: uc.released, 
                tl: uc.tl, 
                tr: uc.tr, 
                jlx: uc.jlx, 
                jly: uc.jly, 
                jrx: uc.jrx, 
                jry: uc.jry 
            };
        }

        // --- Hardware State & Drive Bridge ---
        window.racecarState = window.racecarState || {};
        window.racecarState.accel = { to_py: () => [0, 0, 0] };
        window.racecarState.gyro = { to_py: () => [0, 0, 0] };

        window.unityPushLidar = function (samplesFloat32) {
            window.racecarState = window.racecarState || {};
            window.racecarState.lidar = { to_py: () => samplesFloat32 };
        };

        window.unityPushCamera = function (pixelsUint8, w, h) {
            window.racecarState = window.racecarState || {};
            window.racecarState.camera = { to_py: () => pixelsUint8, w: w, h: h };
        };

        window.unityPushController = function (down, pressed, released, tl, tr, jlx, jly, jrx, jry) {
            window.racecarState = window.racecarState || {};
            window.racecarState._unityController = { down, pressed, released, tl, tr, jlx, jly, jrx, jry };
            updateControllerState();
        };

        window.unitySetDrive = function (speed, angle) {
            if (!window.unityInstance || !isUnityConnected) return;
            const buffer = new ArrayBuffer(12);
            const view = new DataView(buffer);
            view.setUint8(0, 22); // Header index
            view.setFloat32(4, speed, true);
            view.setFloat32(8, angle, true);
            const base64 = btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
            try {
                window.unityInstance.SendMessage('BrowserMessageReceiver', 'ReceiveFromJS', base64);
            } catch(e) {}
        };

        window.unityStopDrive = function () {
            if (!window.unityInstance || !isUnityConnected) return;
            const buffer = new ArrayBuffer(1);
            const view = new DataView(buffer);
            view.setUint8(0, 23); // Header.drive_stop
            const base64 = btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
            try {
                window.unityInstance.SendMessage('BrowserMessageReceiver', 'ReceiveFromJS', base64);
            } catch(e) {}
        };

        window.unitySetMaxSpeed = function (speed) {
            if (!window.unityInstance || !isUnityConnected) return;
            const buffer = new ArrayBuffer(8);
            const view = new DataView(buffer);
            view.setUint8(0, 24); // Header.drive_set_max_speed
            view.setFloat32(4, speed, true);
            const base64 = btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
            try {
                window.unityInstance.SendMessage('BrowserMessageReceiver', 'ReceiveFromJS', base64);
            } catch(e) {}
        };
        // -------------------------------------
        // -------------------------------------

        const loadUnity = () => {
            const unityStatus = document.querySelector("#unity-status");
            const loadingBar = document.querySelector("#unity-loading-bar");
            const progressBarFull = document.querySelector("#unity-progress-bar-full");
            const loadingText = document.querySelector("#unity-loading-text");
            const loadingPercent = document.querySelector("#unity-loading-percent");
            const canvas = document.querySelector("#unity-canvas");

            if (window.location.protocol === "file:") {
                if (loadingBar) loadingBar.style.display = "none";
                unityStatus.textContent = "Needs Server";
                const msg = document.createElement("div");
                msg.style.cssText = "position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);color:#fff;font-family:inherit;padding:1rem;text-align:center;border-radius:8px;z-index:10;";
                msg.innerHTML = "<span style='font-size:2rem'>⚠️</span><br><strong>Simulator unavailable over file://</strong><br><br>Unity WebGL requires <code>SharedArrayBuffer</code>, which browsers only allow when the page is served with COOP/COEP headers from a web server.<br><br>Run <code>python -m http.server 8000</code> in this folder and open <a href='http://localhost:8000' style='color:#7eb8f7'>localhost:8000</a> instead.";
                canvas.parentElement.style.position = "relative";
                canvas.parentElement.appendChild(msg);
                return;
            }

            const startUnity = () => {
                var savedDefine = window.define;
                var savedDefineAmd = savedDefine && savedDefine.amd;
                try {
                    delete window.define;
                } catch (e) {
                    try { window.define = undefined; } catch (e2) { }
                }

                createUnityInstance(canvas, config, (progress) => {
                    const pct = Math.round(progress * 100);
                    if (progressBarFull) progressBarFull.style.width = pct + "%";
                    if (loadingPercent) loadingPercent.textContent = pct + "%";
                    if (loadingText) {
                        if (pct < 90) loadingText.textContent = "Downloading WebGL engine & assets...";
                        else if (pct < 100) loadingText.textContent = "Initializing WebAssembly engine...";
                        else loadingText.textContent = "Launching Simulator...";
                    }
                }).then((instance) => {
                    if (savedDefine) {
                        window.define = savedDefine;
                        if (savedDefineAmd) window.define.amd = savedDefineAmd;
                    }
                    window.unityInstance = instance;
                    if (loadingBar) loadingBar.style.display = "none";
                    unityStatus.textContent = "Simulator Ready";
                    unityStatus.style.background = "rgba(0, 128, 0, 0.5)";
                    
                    // Headless Pyodide Runner
                    (async function() {
                        try {
                            unityStatus.textContent = "Starting Python...";
                            let pyodide = await loadPyodide();
                            
                            unityStatus.textContent = "Loading packages (numpy, cv2)...";
                            await pyodide.loadPackage(['numpy', 'opencv-python']);
                            
                            unityStatus.textContent = "Fetching Python scripts...";
                            const coreCode = await fetch('racecar_core.py').then(r => r.text());
                            const utilsCode = await fetch('racecar_utils.py').then(r => r.text());
                            const userCode = await fetch('functions_document.py').then(r => r.text());
                            
                            pyodide.FS.writeFile('/home/pyodide/racecar_core.py', coreCode);
                            pyodide.FS.writeFile('/home/pyodide/racecar_utils.py', utilsCode);
                            pyodide.FS.writeFile('/home/pyodide/functions_document.py', userCode);
                            
                            unityStatus.textContent = "Executing Python script...";
                            pyodide.runPython(userCode);
                            
                            unityStatus.textContent = "Python Running";
                            unityStatus.style.background = "rgba(0, 0, 255, 0.5)";
                        } catch (err) {
                            console.error("Python Execution Error: ", err);
                            unityStatus.textContent = "Python Error (Check Console)";
                            unityStatus.style.background = "rgba(255, 0, 0, 0.5)";
                        }
                    })();

                }).catch((err) => {
                    console.error("Failed to load Unity Instance:", err);
                    if (loadingText) loadingText.textContent = "Failed to launch WebGL simulator: " + (err.message || err);
                    if (loadingPercent) loadingPercent.textContent = "Error";
                    unityStatus.textContent = "Failed Load";
                    unityStatus.style.background = "rgba(255, 0, 0, 0.5)";
                });
            };

            var script = document.createElement("script");
            script.src = buildUrl + "/frontend.loader.js";
            script.onload = startUnity;
            document.body.appendChild(script);
        };
        
        // Auto load unity when page loads
        window.addEventListener('load', loadUnity);
    </script>
</body>
</html>
